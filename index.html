<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>መልካም አዲስ ዓመት 🌼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;height:100dvh;overflow:hidden;font-family:'Noto Sans Ethiopic',system-ui,sans-serif;background:#060a1e;color:#fff;text-align:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}#fx{position:fixed;inset:0;z-index:0}.stage{position:relative;z-index:2;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:640px}.screen.active{display:flex}.pill{display:inline-block;padding:8px 16px;border-radius:999px;font-size:.85rem;color:#ffe9a3;background:rgba(255,215,120,.12);border:1px solid rgba(255,215,120,.38);margin-bottom:14px}h1{font-size:clamp(1.7rem,7vw,3rem);font-weight:900;color:#ffd76a;text-shadow:0 0 24px rgba(255,190,60,.5);margin:8px 0 12px}.lead{font-size:1rem;color:#efe9d8;max-width:480px;margin:0 auto 16px;line-height:1.7}.card{background:rgba(12,16,34,.6);border:1px solid rgba(255,215,120,.28);border-radius:18px;padding:20px;max-width:360px;width:100%}input{width:100%;padding:14px;font-size:1.05rem;font-family:inherit;text-align:center;color:#fff;background:rgba(255,255,255,.09);border:2px solid rgba(255,215,120,.55);border-radius:12px;outline:none}input:focus{border-color:#ffd76a;box-shadow:0 0 0 4px rgba(255,215,120,.2)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 22px;font-size:1rem;font-weight:700;font-family:inherit;border:none;border-radius:999px;cursor:pointer;min-height:48px}.btn.gold{background:linear-gradient(135deg,#ffd76a,#ff9d3c);color:#3a2000;box-shadow:0 6px 20px rgba(255,180,60,.35)}.btn.ghost{background:rgba(255,255,255,.06);color:#ffe9a3;border:1px solid rgba(255,215,120,.4)}.btn.icon{width:48px;padding:0}.gift{position:relative;width:min(140px,36vw);height:min(150px,40vw);margin:20px auto 10px;cursor:pointer;animation:float 2.5s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,205,90,.45))}@keyframes float{50%{transform:translateY(-8px)}}.gift .box{position:absolute;bottom:0;left:8%;width:84%;height:56%;border-radius:6px 6px 10px 10px;background:linear-gradient(165deg,#2fae5f,#14663a)}.gift .box::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:18%;height:100%;background:linear-gradient(90deg,#caa53d,#ffd76a,#caa53d)}.gift .lid{position:absolute;top:28%;left:2%;width:96%;height:18%;border-radius:6px;background:linear-gradient(165deg,#37bd6b,#186a3e);z-index:2;transition:transform .6s,opacity .6s}.gift .lid::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:18%;height:100%;background:linear-gradient(90deg,#caa53d,#ffd76a,#caa53d)}.gift .lid.off{transform:translateY(-140%) rotate(28deg);opacity:0}.gift.opened{opacity:0;transform:scale(.5);pointer-events:none}#nameLine{font-size:clamp(1.6rem,7vw,2.8rem);font-weight:900;color:#ffd76a;margin:6px 0 12px;min-height:1.3em}.verse{font-size:clamp(1rem,3.5vw,1.15rem);color:#ffd76a;font-style:italic;max-width:520px;margin:12px auto 16px;line-height:1.6;padding:12px 14px;background:rgba(255,215,120,.07);border-radius:12px;border-left:3px solid #ffd76a;text-align:left}.verse-ref{display:block;font-size:.82em;color:#ffe9a3;margin-top:8px;font-weight:700;font-style:normal;text-align:right}.line{font-size:1rem;line-height:1.7;max-width:500px;margin:6px auto;color:#f0e9d6}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.hint{margin-top:18px;font-size:.9rem;color:#ffe9a3}.credit{margin-top:24px;font-size:.85rem;color:rgba(255,255,255,.65)}.credit a{color:#ffd76a;text-decoration:none;font-weight:700}#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(80px);background:rgba(18,22,38,.94);border:1px solid rgba(255,215,120,.4);color:#ffe9a3;padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:.4s;z-index:70}#toast.show{opacity:1;transform:translateX(-50%)}.nav{display:flex;gap:8px;justify-content:center;margin-top:6px}.nav button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,215,120,.35);background:rgba(255,255,255,.06);color:#ffe9a3;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="stage">
  <div class="screen active" id="s1">
    <div class="pill">✨ እንኳን ደህና አደረስን · <span id="y1">—</span> ዓ.ም ✨</div>
    <h1>መልካም አዲስ ዓመት 🌼</h1>
    <p class="lead">ልዩ የአዲስ ዓመት ስጦታ ተዘጋጅቷል። እባክዎ ስምዎን ያስገቡ።</p>
    <div class="card">
      <input id="nameInput" placeholder="ስምዎን እዚህ ይጻፉ..." maxlength="24">
      <p id="err" style="color:#ff8a80;min-height:1.2em;margin:8px 0;font-size:.9rem"></p>
      <button class="btn gold" id="startBtn">ስጦታዬን ክፈት 🎁</button>
    </div>
  </div>
  <div class="screen" id="s2">
    <p class="lead">ይህ ስጦታ የተዘጋጀው ለ <strong style="color:#ffd76a" id="giftFor"></strong> ነው!</p>
    <div class="gift" id="gift"><div class="box"></div><div class="lid"></div></div>
    <p class="hint">👆 ለመክፈት ይንኩት!</p>
  </div>
  <div class="screen" id="s3">
    <div class="pill">🎉 እንኳን ደህና አደረስን · <span id="y2">—</span> ዓ.ም 🎉</div>
    <div id="nameLine"></div>
    <div class="verse"><span id="vText"></span><span class="verse-ref" id="vRef"></span></div>
    <div class="nav"><button id="prevB">‹</button><button id="nextB">›</button></div>
    <p class="line" id="bLine"></p>
    <div class="actions">
      <button class="btn gold icon" id="soundBtn">🔊</button>
      <button class="btn gold" id="shareBtn">📤 አጋራ</button>
      <button class="btn ghost" id="copyBtn">📋 ጽሑፍ</button>
      <button class="btn ghost" id="againBtn">🔄 ሌላ ስም</button>
    </div>
    <p class="hint">👆 ባዶ ቦታ ላይ ይንኩ — ፍንዳታ!</p>
    <div class="credit">Developer by <a href="https://github.com/Menelik2" target="_blank" rel="noopener">ምኒልክ አድማሱ</a></div>
  </div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function getEthYear(d=new Date()){const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();return (m>9||(m===9&&day>=11))?y-7:y-8}
const ETH=getEthYear();
$('y1').textContent=$('y2').textContent=ETH;
document.title=`መልካም አዲስ ዓመት 🌼 | ${ETH} ዓ.ም`;

let BLESSINGS=[
{verse:'"በቸርነትህ ዓመትን ታቀዳጃለህ፥ ምድረ በዳውም ስብን ይጠግባል።"',ref:'— መዝሙረ ዳዊት 65፥11',line:'አዲሱ ዓመት የሰላም፣ የጤና፣ የብልፅግና እና የደስታ ይሁንልዎት! 🌼'},
{verse:'"እግዚአብሔር ይባርክህ፥ ይጠብቅህም።"',ref:'— ዘኍልቍ 6፥24',line:'በረከትና ጥበቃ ሁልጊዜ ከእርስዎ ጋር ይሁን! ✨'},
{verse:'"ተስፋ አትቁረጡ።"',ref:'— ናሆም 1፥7',line:'ይህ ዓመት የተስፋና የድል ዓመት ይሁንልዎት! 🌟'}
];
let bIdx=0;
fetch('blessings.json').then(r=>r.json()).then(d=>{if(Array.isArray(d)&&d.length>3){BLESSINGS=d;showB(Math.floor(Math.random()*BLESSINGS.length))}}).catch(()=>{});
function showB(i){bIdx=(i+BLESSINGS.length)%BLESSINGS.length;const b=BLESSINGS[bIdx];$('vText').textContent=b.verse;$('vRef').textContent=b.ref;$('bLine').textContent=b.line}
showB(0);

const cv=$('fx'),ctx=cv.getContext('2d');
let W=0,H=0,sparks=[],rockets=[];
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function addSpark(o){if(sparks.length<900){o.max=o.life;sparks.push(o)}}
function explode(x,y,c){for(let i=0;i<60;i++){const a=rand(0,6.28),sp=Math.pow(Math.random(),.55)*rand(120,280);addSpark({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:Math.random()<.7?c:'#fff',life:rand(.8,1.5),grav:160,drag:1.8,size:rand(1.2,2.5)})}}
function launch(x,ty){const t=ty??rand(H*.15,H*.4);rockets.push({x:x??rand(W*.2,W*.8),y:H+10,vx:rand(-15,15),vy:-Math.sqrt(2*900*((H+10)-t)),ty:t,c:pick(['#ffd76a','#28c76f','#ff5a4e','#FCDD09'])})}
function loop(){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#060a1e');g.addColorStop(.5,'#3d2454');g.addColorStop(1,'#e0893b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const dt=.016;
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.vy+=900*dt;r.x+=r.vx*dt;r.y+=r.vy*dt;if(r.vy>=-15||r.y<=r.ty){explode(r.x,r.y,r.c);rockets.splice(i,1)}}
  ctx.globalCompositeOperation='lighter';
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue}const dr=Math.exp(-p.drag*dt);p.vx*=dr;p.vy=p.vy*dr+p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=Math.max(p.life/p.max,0);ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,p.size*(.3+.7*a)),0,6.28);ctx.fill()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setInterval(()=>launch(),3000);

let NAME='',opened=false,musicOn=true;
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
$('startBtn').onclick=()=>{
  let n=$('nameInput').value.trim().replace(/\s+/g,' ');
  if(!n){$('err').textContent='እባክዎ ስምዎን ያስገቡ!';return}
  const am=/[\u1200-\u137F]/.test(n);
  NAME=am?((n.endsWith('ዬ')||n.endsWith('የ'))?n:n+'ዬ'):(n.toLowerCase().endsWith('ye')?n:n+'ye');
  try{localStorage.setItem('ny_name',n)}catch(e){}
  $('giftFor').textContent=NAME;go('s2');
};
$('nameInput').onkeydown=e=>{if(e.key==='Enter')$('startBtn').click()};
try{const l=localStorage.getItem('ny_name');if(l)$('nameInput').value=l}catch(e){}
const up=new URLSearchParams(location.search);if(up.get('name'))$('nameInput').value=decodeURIComponent(up.get('name')).slice(0,24);

$('gift').onclick=()=>{
  if(opened)return;opened=true;
  $('gift').querySelector('.lid').classList.add('off');
  setTimeout(()=>{$('gift').classList.add('opened');
    const r=$('gift').getBoundingClientRect();explode(r.left+r.width/2,r.top+r.height/2,'#ffd76a');
    launch(W*.25,H*.3);launch(W*.75,H*.25);
    go('s3');showB(Math.floor(Math.random()*BLESSINGS.length));
    $('nameLine').textContent=NAME;
  },500);
};
$('prevB').onclick=()=>showB(bIdx-1);
$('nextB').onclick=()=>showB(bIdx+1);
$('againBtn').onclick=()=>location.href=location.pathname;
$('shareBtn').onclick=async()=>{
  const u=new URL(location.href);if(NAME)u.searchParams.set('name',NAME.replace(/ዬ$|ye$/i,''));
  const d={title:`መልካም አዲስ ዓመት ${ETH} ዓ.ም`,text:`መልካም አዲስ ዓመት ${NAME}! 🎁`,url:u.toString()};
  try{if(navigator.share)await navigator.share(d);else if(navigator.clipboard){await navigator.clipboard.writeText(u.toString());toast('🔗 ሊንኩ ተቀድቷል!')}}catch(e){}
};
$('copyBtn').onclick=async()=>{
  const b=BLESSINGS[bIdx];
  const t=`መልካም አዲስ ዓመት ${NAME}!\n\n${b.verse}\n${b.ref}\n\n${b.line}\n\n${ETH} ዓ.ም 🌼`;
  try{await navigator.clipboard.writeText(t);toast('📋 ጽሑፉ ተቀድቷል!')}catch(e){toast('መቅዳት አልተቻለም')}
};
$('soundBtn').onclick=()=>{musicOn=!musicOn;$('soundBtn').textContent=musicOn?'🔊':'🔇';toast(musicOn?'🔊 በርቷል':'🔇 ጠፍቷል')};
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input,a,.gift,.card'))return;
  launch(Math.min(Math.max(e.clientX,20),W-20),Math.min(Math.max(e.clientY,40),H*.55));
},{passive:true});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
</script>
</body>
</html>
